version: "3.9"
services:
  backend:
    build: ./backend
    ports:
      - "8081:8081"
    env_file:
      - ./backend/.env
    environment:
      - PORT=8081
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8081/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
